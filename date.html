<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Date Me?</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
     

       <style>
        * { box-sizing: border-box; }
        body {
            background-color: #ffd1b3;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 15px;
        }
        h1 {
            text-align: center;
            font-size: clamp(18px, 4vw, 24px);
            text-shadow: 0px 0px 10px rgba(255, 20, 147, 0.7);
            color: white;
            margin-bottom: 20px;
        }
        #sprinkle-container {
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0; left: 0;
            z-index: 1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            bottom: -50px;
            font-size: 25px;
            animation: rise linear infinite;
            opacity: 1;
            color: #ff69b4;
            text-shadow: 0 0 10px #ff69b4;
            pointer-events: none;
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(2); opacity: 0; }
        }
        .contain {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 25px 20px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            animation: fadeIn 1s forwards;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            text-align: center;
            background-image: linear-gradient(to bottom, rgba(245, 130, 174, 0.4), rgba(255, 255, 255, 0.4)), url(6.webp);
            background-position: center;
            background-size: cover;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
        }
        .btn-group {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 30px;
            position: relative;
            height: 60px;
            width: 100%;
        }
        #yes-btn, #no-btn, #submit-btn {
            font-family: Arial, sans-serif;
            color: white;
            font-size: 16px;
            font-style: italic;
            font-weight: bold;
            background-color: white;
            box-shadow: 0.3rem 0.6rem 2rem rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            border: none;
            padding: 10px 20px;
            background-image: url(https://media2.giphy.com/media/ZkwbvaFT7ZaAU/giphy.gif?cid=6c09b952cxs7kiuubfcfuktb56c2rihcvkbs1qd5q2gzlwf2&ep=v1_internal_gif_by_id&rid=giphy.gif&ct=g);
            background-position: center;
            background-size: cover;
            cursor: pointer;
        }
        #no-btn {
            position: absolute;
            right: 15px;
            transition: 0.2s ease-in-out;
        }
        p {
            font-size: 13px;
            font-style: italic;
            font-weight: bold;
            text-align: left;
            margin: 8px 0 2px 5px;
            color: white;
            text-shadow: 0px 0px 10px rgba(255, 20, 147, 0.7);
        }
        input[type="text"] {
            width: 100%;
            box-shadow: 0.3rem 0.6rem 2rem rgba(0, 0, 0, 0.5);
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            height: 35px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 5px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        #date-details-box {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        #submit-btn {
            margin-top: 15px;
            width: 100%;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body onload="initPage()">
    <div id="sprinkle-container"></div>
    
    <div class="contain" id="d">
        <div id="proposal-box">
            <h1>Do you wanna go on a date with me? 💖</h1>
            <div class="btn-group">
                <button id="yes-btn" onclick="acceptDate()">Yes 🥰</button>
                <button id="no-btn" onmouseover="moveButton()" ontouchstart="moveButton()">No 😢</button>
            </div>
        </div>

        <form id="dateForm" action="https://formsubmit.co/sagarwal2k20@gmail.com" method="POST" onsubmit="return submitDateForm(event)">
            <input type="hidden" name="_next" value="https://piyush1234-lab.github.io/Piyush1234.github.io/birthday.html">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_subject" value="She said YES! Date Details Inside 💕">

            <div id="date-details-box" style="display: none;">
                <h1>Yay! Let's plan it out ✨</h1>
                
                <p>Select Date:</p>
                <input id="date-picker" type="text" name="Date" placeholder="Pick a date" required>

                <p>Select Time:</p>
                <input id="time-picker" type="text" name="Time" placeholder="Pick a time" required>

                <p>Place where u want to go</p>
                <input type="text" name="Place" placeholder="Bachank, etc." required>

                <p>Type of Date (e.g., Dinner, Movie):</p>
                <input id="type-input" type="text" name="Date_Type" placeholder="Dinner, Coffee, etc." required>

                <button id="submit-btn" type="submit">Confirm Date 💌</button>
            </div>
        </form>

        <div id="success-box" style="display: none;">
            <h1>Get ready! Piyush will soon msg u confirming the date and the Time. 🥳</h1>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script>
        function initPage() {
            let d = document.getElementById("d");
            d.style.visibility = "visible";

            const container = document.getElementById('sprinkle-container');
            for (let i = 0; i < 30; i++) {
                let p = document.createElement('div');
                p.classList.add('particle');
                p.innerText = "❤";        
                p.style.left = Math.random() * 100 + "vw";
                p.style.animationDuration = 2 + Math.random() * 3 + "s";
                p.style.animationDelay = Math.random() * 2 + "s";
                container.appendChild(p);
            }

            sendPendingData();
            window.addEventListener('online', sendPendingData);
        }

        function moveButton() {
            let noBtn = document.getElementById("no-btn");
            let randomX = Math.floor(Math.random() * 100) - 50;
            let randomY = Math.floor(Math.random() * 80) - 40;
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function acceptDate() {
            document.getElementById("proposal-box").style.display = "none";
            document.getElementById("date-details-box").style.display = "flex";

            flatpickr("#date-picker", { dateFormat: "d-m-Y", minDate: "today" });
            flatpickr("#time-picker", { enableTime: true, noCalendar: true, dateFormat: "H:i" });
        }

        function submitDateForm(event) {
            event.preventDefault();
            
            let form = document.getElementById("dateForm");
            let formData = new FormData(form);
            let dataObject = {};
            formData.forEach((value, key) => { dataObject[key] = value; });

            document.getElementById("date-details-box").style.display = "none";
            document.getElementById("success-box").style.display = "block";

            if (!navigator.onLine) {
                localStorage.setItem("pendingDateSubmission", JSON.stringify(dataObject));
            } else {
                sendToServer(dataObject);
            }
            setTimeout(() => {
        window.location.href = "https://piyush1234-lab.github.io/Piyush1234.github.io/redirect.html"; 
    }, 3500); // 3500ms = 3.5 seconds delay

            return false;
        }
        
        function sendToServer(dataObject) {
            let form = document.getElementById("dateForm");
            let formData = new URLSearchParams(dataObject);

            fetch(form.action, {
                method: "POST",
                body: formData,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    localStorage.removeItem("pendingDateSubmission");
                }
            }).catch(error => {
                localStorage.setItem("pendingDateSubmission", JSON.stringify(dataObject));
            });
        }

        function sendPendingData() {
            let savedData = localStorage.getItem("pendingDateSubmission");
            if (savedData && navigator.onLine) {
                let dataObject = JSON.parse(savedData);
                let form = document.getElementById("dateForm");
                let formData = new URLSearchParams(dataObject);

                fetch(form.action, {
                    method: "POST",
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                }).then(response => {
                    if (response.ok) {
                        localStorage.removeItem("pendingDateSubmission");
                    }
                }).catch(e => console.log("Retry deferred."));
            }
        }
    </script>
</body>
</html>
